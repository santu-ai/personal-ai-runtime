[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v", "--tb=short"]
markers = [
    "live_llm: requires a real LLM_API_KEY; excluded by default via -m 'not live_llm'",
]

[project]
name = "personal-ai-runtime-backend"
requires-python = ">=3.12"
# Canonical pinned set: requirements.txt (used by make install / CI).
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.0",
    "uvloop==0.22.1 ; sys_platform != 'win32' and implementation_name == 'cpython'",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "openai==2.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "chromadb==1.5.9",
    "httpx==0.28.1",
    "mcp==2.0.0",
    "alembic==1.18.5",
    "sqlalchemy==2.0.51",
    "tiktoken==0.13.0",
    "structlog==26.1.0",
    "cryptography==49.0.0",
    "pypdf==6.15.0",
    "python-docx==1.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "normal"

[tool.coverage.run]
source = ["app/api", "app/product"]
# Runtime modules are covered via make test-backend-coverage (--cov=app/core/runtime).
# Do not omit critical governance / loop modules.
