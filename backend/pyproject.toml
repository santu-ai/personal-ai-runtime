[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v", "--tb=short"]
markers = [
    "live_llm: requires a real LLM_API_KEY; excluded by default via -m 'not live_llm'",
]

[project]
name = "personal-ai-runtime-backend"
requires-python = ">=3.12"
# Canonical pinned set: requirements.txt (used by make install / CI).
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "uvloop==0.22.1 ; sys_platform != 'win32' and implementation_name == 'cpython'",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "openai==3.13.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "chromadb==1.5.9",
    "httpx==0.28.1",
    "mcp==2.2.0",
    "alembic==1.20.0",
    "sqlalchemy==2.0.52",
    "tiktoken==0.14.0",
    "structlog==26.1.0",
    "cryptography==50.0.1",
    "pypdf==6.18.1",
    "python-docx==1.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "normal"

[tool.coverage.run]
source = ["app/core/runtime", "app/core/harness", "app/api", "app/product"]
# Coverage gates live in make test-backend-coverage (runtime≥75, api≥50, harness≥66, product≥79).
