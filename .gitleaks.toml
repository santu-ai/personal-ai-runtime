title = "Personal AI Runtime secrets allowlist"

[extend]
useDefault = true

[[allowlists]]
description = "Allow example/template values that look like secrets"
paths = [
  '''\.env\.example$''',
  '''docs/.*\.md$''',
  '''\.harness/.*\.md$''',
  '''README.*\.md$''',
  '''CONTRIBUTING\.md$''',
]
regexes = [
  '''your-deepseek-api-key''',
  '''your-gmail-app-password''',
  '''your-email@gmail\.com''',
  '''sk-test-key''',
  '''demo-seed''',
  '''placeholder-not-a-secret''',
]

[[allowlists]]
description = "Allow placeholder hashes in test fixtures"
paths = [
  '''backend/tests/.*''',
]

[[allowlists]]
description = "Historical egress-gate fixture; working tree rewrote the value in 78e7f26"
fingerprints = [
  '''b118877853bc01173016da0979234d568903323d:backend/tests/runtime/test_egress_gate.py:generic-api-key:41''',
]
